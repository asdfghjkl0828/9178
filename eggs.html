<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>孵蛋查询 - Roke 伤害计算工具箱</title>
<link rel="stylesheet" href="css/head.css">
<style>
  .egg-intro { font-size:13px; color:var(--text2); line-height:1.7; margin-bottom:14px; background:rgba(124,107,255,.07); border:1px solid rgba(124,107,255,.22); border-radius:10px; padding:10px 14px; }
  .egg-intro b { color:var(--accent); }
  .egg-intro code { background:var(--bg); padding:1px 6px; border-radius:5px; color:var(--text); font-size:12px; }

  .egg-panel { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
  .egg-inputs { display:flex; flex-wrap:wrap; gap:22px; }
  .egg-field { flex:1; min-width:240px; }
  .egg-field > label { font-size:12px; color:var(--text2); font-weight:600; display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .egg-field .val { font-size:18px; font-weight:800; color:var(--accent); }
  .egg-field .val small { font-size:11px; color:var(--text2); font-weight:600; margin-left:3px; }
  .egg-field input[type=range] { width:100%; accent-color:var(--accent); cursor:pointer; }
  .egg-num { display:flex; align-items:center; gap:8px; margin-top:10px; }
  .egg-num input { width:120px; background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:9px 12px; color:var(--text); font-size:15px; font-family:inherit; font-weight:700; }
  .egg-num input:focus { outline:none; border-color:var(--accent); }
  .egg-num .unit { font-size:13px; color:var(--text2); }

  .egg-filters { display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin-top:6px; }
  .seg { display:inline-flex; background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:3px; gap:3px; flex-wrap:wrap; }
  .seg button { border:none; background:transparent; color:var(--text2); font-family:inherit; font-size:13px; font-weight:600; padding:7px 13px; border-radius:7px; cursor:pointer; transition:.15s; }
  .seg button:hover { color:var(--text); }
  .seg button.active { background:var(--accent); color:#fff; }

  .presets { display:flex; flex-wrap:wrap; gap:7px; margin-top:14px; }
  .preset { font-size:12px; color:var(--text2); background:var(--bg); border:1px solid var(--border); border-radius:18px; padding:5px 12px; cursor:pointer; transition:.15s; }
  .preset:hover { color:var(--accent); border-color:var(--accent); }
  .egg-warn { display:none; font-size:12px; color:#ff9a9a; background:rgba(255,80,80,.1); border:1px solid rgba(255,80,80,.3); border-radius:9px; padding:8px 12px; margin-top:12px; line-height:1.6; }
  .egg-warn.show { display:block; }

  .stat-line { font-size:13px; color:var(--text2); margin:4px 2px 12px; line-height:1.6; }
  .stat-line b { color:var(--accent); }
  .stat-line .note { color:var(--text2); font-size:12px; }

  .result-list { display:flex; flex-direction:column; gap:10px; }
  .result-card { display:flex; align-items:center; gap:13px; background:var(--card); border:1px solid var(--border); border-radius:13px; padding:11px 14px; transition:.12s; cursor:pointer; text-decoration:none; }
  .result-card:hover { border-color:var(--accent); background:var(--card2); }
  .result-card .rank { font-size:15px; font-weight:800; color:var(--text2); width:28px; text-align:center; flex-shrink:0; }
  .result-card .rank.top { color:var(--accent); }
  .result-main { flex:1; min-width:0; }
  .result-name { font-size:15px; font-weight:800; color:var(--text); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .attr-tag { font-size:10px; font-weight:700; color:#fff; padding:1px 7px; border-radius:6px; }
  .result-meta { display:flex; align-items:center; gap:9px; margin-top:5px; flex-wrap:wrap; }
  .prob-label { font-size:10px; font-weight:700; padding:1px 7px; border-radius:6px; flex-shrink:0; }
  .m-full { background:rgba(79,189,114,.2); color:#4FBD72; }
  .m-part { background:rgba(124,107,255,.22); color:var(--accent); }
  .m-approx { background:rgba(255,255,255,.1); color:var(--text2); }
  .result-pct { font-size:11px; color:var(--text2); margin-top:4px; }
  .result-pct b { color:var(--text); font-weight:700; }
  .ava-wrap { position:relative; width:46px; height:46px; border-radius:50%; overflow:hidden; flex-shrink:0; background:var(--bg); }
  .ava-wrap img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .ava-wrap .fallback { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--text2); font-size:17px; }
  .copy-btn { margin-left:auto; font-size:12px; color:var(--text2); background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:6px 12px; cursor:pointer; flex-shrink:0; }
  .copy-btn:hover { color:var(--accent); border-color:var(--accent); }
  /* Top1 强调卡 */
  .top-result { border-color:var(--accent); background:linear-gradient(180deg, rgba(124,107,255,.12), var(--card)); padding:14px 16px; }
  .top-result .result-name { font-size:17px; }
  .top-badge { font-size:11px; font-weight:800; color:#fff; background:var(--accent); border-radius:6px; padding:2px 8px; }
  .empty-row { text-align:center; color:var(--text2); padding:30px; background:var(--card); border:1px dashed var(--border); border-radius:13px; }
  @media (max-width:560px){ .egg-inputs { gap:16px; } }
</style>
</head>
<body>
<header>
  <h1>孵蛋查询</h1>
  <span>输入蛋的尺寸与重量 · 反查最可能孵出的精灵</span>
  <nav class="dex-nav">
    <a href="calc.html">伤害计算器</a>
    <a href="pokedex.html">精灵图鉴</a>
    <a href="skilldex.html">技能图鉴</a>
    <a href="restraint.html">克制计算器</a>
    <a href="speed.html">速度榜单</a>
    <a href="eggs.html" class="active">孵蛋查询</a><a href="merchant.html">远行商人</a><a href="home.html">家园查询</a>
  </nav>
  <div class="header-actions">
    <div class="theme-toggle" id="themeToggle"><span class="tt-icon">🌙</span><span class="tt-text">深色</span></div>
  </div>
</header>

<div class="main">
  <div class="egg-intro">
    把蛋的<b>尺寸</b>（米）和<b>重量</b>（千克）填进去，按每只可孵化精灵的蛋尺寸/重量<b>范围</b>判断「范围是否吻合」并排序，最吻合的排最前。
    例如喵喵蛋：尺寸 <b>0.27</b> 米、重量 <b>1.562</b> 千克。数据基于 roco-eggs 公开数据集（共 <b id="totalN">0</b> 只可孵化精灵）。
    <b>注意：</b>不同精灵的蛋尺寸/重量范围有重叠，一个蛋值可能对应多只精灵，列表都可能是答案，仅供参考。
  </div>

  <div class="egg-panel">
    <div class="egg-inputs">
      <div class="egg-field">
        <label>蛋尺寸 <span class="val" id="sizeVal">0.27<small>m</small></span></label>
        <input type="range" id="sizeRange" min="0" max="3.0" step="0.01" value="0.27">
        <div class="egg-num">
          <input type="number" id="sizeNum" step="0.01" value="0.27">
          <span class="unit">米</span>
        </div>
      </div>
      <div class="egg-field">
        <label>蛋重量 <span class="val" id="weightVal">1.562<small>kg</small></span></label>
        <input type="range" id="weightRange" min="0" max="720" step="0.01" value="1.562">
        <div class="egg-num">
          <input type="number" id="weightNum" step="0.01" value="1.562">
          <span class="unit">千克</span>
        </div>
      </div>
    </div>

    <div class="egg-filters">
      <div class="seg" id="eggSeg">
        <button data-egg="any" class="active">不限</button>
        <button data-egg="normal">普通蛋</button>
        <button data-egg="rideable">坐骑蛋</button>
      </div>
      <button class="copy-btn" id="copyBtn">复制结果</button>
    </div>

    <div class="presets" id="presets"></div>
    <div class="egg-warn" id="eggWarn"></div>
  </div>

  <div class="stat-line" id="statLine"></div>
  <div class="result-list" id="resultList"></div>
</div>

<script src="data/type.js"></script>
<script src="data/egg_spirits.js"></script>
<script>
const state = { size:0.27, weight:1.562, egg:'any' };

// 示例预设（取自数据集中各精灵真实蛋区间内的代表值）
const PRESETS = [
  { n:'喵喵', s:0.27, w:1.562 },
  { n:'火花', s:0.27, w:3.14 },
  { n:'蹦蹦种子', s:0.56, w:4.95 },
  { n:'电咩咩', s:0.70, w:8.14 },
  { n:'雪豆丁', s:1.04, w:11.0 }
];

function validList(){
  return EGG_SPIRITS.filter(function(e){
    if (!e.s || !e.w) return false;
    if (state.egg === 'normal' && e.e.indexOf('normal') < 0) return false;
    if (state.egg === 'rideable' && e.e.indexOf('rideable') < 0) return false;
    return true;
  });
}

// 匹配：判断输入是否落在精灵蛋的尺寸/重量区间内，并算「到区间中心的距离」用于排序。
// level: 2=尺寸和重量都在范围内（蛋范围吻合）；1=仅一个维度吻合（部分吻合）；0=都不吻合（近似，按到最近边距离排）。
function evalMatch(e, S, W){
  const smin=e.s[0], smax=e.s[1], wmin=e.w[0], wmax=e.w[1];
  const inS = (S>=smin && S<=smax);
  const inW = (W>=wmin && W<=wmax);
  const cS=(smin+smax)/2, cW=(wmin+wmax)/2;
  const dC = Math.sqrt((S-cS)*(S-cS) + (W-cW)*(W-cW)); // 到区间中心距离（越小越像）
  const gS = inS ? 0 : (S<smin ? smin-S : S-smax);
  const gW = inW ? 0 : (W<wmin ? wmin-W : W-wmax);
  const gap = Math.sqrt(gS*gS + gW*gW); // 到最近边距离（区间外才有）
  const level = (inS && inW) ? 2 : (inS || inW) ? 1 : 0;
  return { e:e, level:level, dC:dC, gap:gap, inS:inS, inW:inW };
}

function compute(){
  const S=state.size, W=state.weight;
  const ranked = validList().map(function(e){ return evalMatch(e,S,W); })
    .sort(function(a,b){
      if (b.level !== a.level) return b.level - a.level;       // 吻合层级高优先
      if (a.level === 2) return a.dC - b.dC;                    // 双吻合内：离中心近优先
      return a.gap - b.gap;                                     // 其余：离边界近优先
    });
  const matched = ranked.filter(function(x){ return x.level >= 1; });
  const display = matched.length ? matched : ranked.slice(0, 6); // 无吻合则取最近 6 只近似
  return { ranked:ranked, display:display };
}

function avatar(en){
  const ch=en.n.charAt(0);
  if (en.img)
    return '<span class="ava-wrap"><span class="fallback">'+ch+'</span><img src="'+en.img+'" alt="'+en.n+'" loading="lazy" onerror="this.style.display=\'none\'"></span>';
  return '<span class="ava-wrap"><span class="fallback">'+ch+'</span></span>';
}

function attrTags(en){
  return (en.a||[]).map(function(a){
    const c=TYPE_COLORS[a] || '#888';
    return '<span class="attr-tag" style="background:'+c+'">'+a+'</span>';
  }).join('');
}

function pctText(v){
  if (v<0) return '偏低';
  if (v>100) return '偏高';
  return v+'%';
}

function render(){
  const res=compute();
  const display=res.display;
  const fullN=res.ranked.filter(function(x){ return x.level===2; }).length;
  const partN=res.ranked.filter(function(x){ return x.level===1; }).length;
  const list=document.getElementById('resultList');
  const stat=document.getElementById('statLine');

  if (!display.length){
    list.innerHTML='<div class="empty-row">没有可用数据，请稍后再试。</div>';
    stat.innerHTML='';
    return;
  }

  // 统计行
  if (fullN > 0){
    let note = fullN > 1 ? '<span class="note">（这些精灵的蛋尺寸/重量范围重叠，都可能是答案）</span>' : '';
    stat.innerHTML='蛋尺寸和重量都落在 <b>'+fullN+'</b> 只精灵的蛋范围内 '+note;
  } else if (partN > 0){
    stat.innerHTML='尺寸或重量落在 <b>'+partN+'</b> 只精灵的蛋范围内（部分吻合），没有完全吻合的。';
  } else {
    stat.innerHTML='没有完全吻合的精灵，以下是尺寸/重量最接近的近似候选。';
  }

  list.innerHTML=display.map(function(x, i){
    const top1 = (i === 0);
    const rankCls = top1 ? 'rank top' : 'rank';
    let label, lcls;
    if (x.level === 2){ label='蛋范围吻合'; lcls='m-full'; }
    else if (x.level === 1){ label='部分吻合'; lcls='m-part'; }
    else { label='最接近'; lcls='m-approx'; }
    const sizePos = x.inS ? ('区间内 ' + pctText(Math.round((state.size-x.e.s[0])/(x.e.s[1]-x.e.s[0])*100))) : (state.size<x.e.s[0]?'低于范围':'高于范围');
    const weightPos = x.inW ? ('区间内 ' + pctText(Math.round((state.weight-x.e.w[0])/(x.e.w[1]-x.e.w[0])*100))) : (state.weight<x.e.w[0]?'低于范围':'高于范围');
    const topCls = top1 ? ' top-result' : '';
    const badge = top1 ? '<span class="top-badge">🎯 最可能</span>' : '';
    return '<a class="result-card'+topCls+'" href="pokedex.html?spirit='+encodeURIComponent(x.e.n)+'">'+
      '<div class="'+rankCls+'">'+(i+1)+'</div>'+
      avatar(x.e)+
      '<div class="result-main">'+
        '<div class="result-name">'+badge+x.e.n+attrTags(x.e)+'</div>'+
        '<div class="result-meta">'+
          '<span class="prob-label '+lcls+'">'+label+'</span>'+
          '<span class="result-pct" style="margin:0">范围 '+x.e.s[0]+'~'+x.e.s[1]+'m / '+x.e.w[0]+'~'+x.e.w[1]+'kg</span>'+
        '</div>'+
        '<div class="result-pct">你的输入：尺寸 <b>'+sizePos+'</b> · 重量 <b>'+weightPos+'</b></div>'+
      '</div>'+
    '</a>';
  }).join('');
}

function fmtNum(v){ return (Math.round(v*1000)/1000).toString(); }

function syncInputs(){
  document.getElementById('sizeRange').value=state.size;
  document.getElementById('sizeNum').value=state.size;
  document.getElementById('weightRange').value=state.weight;
  document.getElementById('weightNum').value=state.weight;
  document.getElementById('sizeVal').innerHTML=fmtNum(state.size)+'<small>m</small>';
  document.getElementById('weightVal').innerHTML=fmtNum(state.weight)+'<small>kg</small>';
}

// 已知蛋范围（仅用于温和提示，输入下限不限制，下限为 0 即不设最小）
const RANGE = { size:{min:0, max:3.0}, weight:{min:0, max:720} };
function showWarn(kind, raw){
  const r=RANGE[kind];
  const el=document.getElementById('eggWarn');
  el.textContent='⚠ '+ (kind==='size'?'蛋尺寸':'蛋重量') +'已知蛋最大约 '+r.max+(kind==='size'?'m':'kg')+'，你输入的 '+raw+' 已超出该上限，下方为最接近的近似候选，可能不准。';
  el.classList.add('show');
}
function hideWarn(){ document.getElementById('eggWarn').classList.remove('show'); }

// 数字框自由输入：输入过程中不夹断、不回写输入框；只同步滑块与标签并实时渲染
function bindNum(id, key, unit){
  document.getElementById(id).addEventListener('input', function(){
    const raw=this.value;
    if (raw==='' || raw.endsWith('.')){ return; } // 仍在输入（如 "0."），不重算也不重置输入框
    const v=parseFloat(raw);
    if (isNaN(v)) return;
    if (v>RANGE[key].max) showWarn(key, raw); else hideWarn();
    state[key]=v;
    document.getElementById(key==='size'?'sizeRange':'weightRange').value = Math.min(RANGE[key].max, Math.max(RANGE[key].min, v));
    document.getElementById(key==='size'?'sizeVal':'weightVal').innerHTML = fmtNum(v)+'<small>'+unit+'</small>';
    render();
  });
}

// 控件绑定
document.getElementById('sizeRange').addEventListener('input', function(){ state.size=parseFloat(this.value); syncInputs(); render(); });
document.getElementById('weightRange').addEventListener('input', function(){ state.weight=parseFloat(this.value); syncInputs(); render(); });
bindNum('sizeNum', 'size', 'm');
bindNum('weightNum', 'weight', 'kg');
document.getElementById('eggSeg').addEventListener('click', function(e){
  const btn=e.target.closest('button'); if(!btn) return;
  state.egg=btn.dataset.egg;
  Array.prototype.forEach.call(this.children, function(b){ b.classList.toggle('active', b===btn); });
  render();
});

// 预设示例
const presetsEl=document.getElementById('presets');
presetsEl.innerHTML=PRESETS.map(function(p){
  return '<span class="preset" data-s="'+p.s+'" data-w="'+p.w+'">'+p.n+'（'+p.s+'m/'+p.w+'kg）</span>';
}).join('');
presetsEl.addEventListener('click', function(e){
  const el=e.target.closest('.preset'); if(!el) return;
  state.size=parseFloat(el.dataset.s); state.weight=parseFloat(el.dataset.w);
  syncInputs(); render();
});

// 复制结果
document.getElementById('copyBtn').addEventListener('click', function(){
  const res=compute(); if(!res.display.length){ alert('暂无匹配结果'); return; }
  let txt='【孵蛋查询】尺寸 '+state.size.toFixed(2)+'m / 重量 '+state.weight.toFixed(2)+'kg\n';
  res.display.forEach(function(x,i){
    const tag = x.level===2?'蛋范围吻合':(x.level===1?'部分吻合':'最接近');
    txt+=(i+1)+'. '+x.e.n+' ['+tag+'] 范围 '+x.e.s[0]+'~'+x.e.s[1]+'m/'+x.e.w[0]+'~'+x.e.w[1]+'kg\n';
  });
  navigator.clipboard.writeText(txt).then(function(){ alert('已复制结果'); }, function(){ alert('复制失败，请手动选择'); });
});

// 主题切换
(function(){
  const t=document.getElementById('themeToggle');
  const saved=localStorage.getItem('theme');
  if (saved==='light') document.documentElement.setAttribute('data-theme','light');
  function sync(){
    const isLight=document.documentElement.getAttribute('data-theme')==='light';
    t.querySelector('.tt-icon').textContent=isLight?'☀️':'🌙';
    t.querySelector('.tt-text').textContent=isLight?'浅色':'深色';
  }
  sync();
  t.addEventListener('click', function(){
    const isLight=document.documentElement.getAttribute('data-theme')==='light';
    if(isLight){ document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme','dark'); }
    else { document.documentElement.setAttribute('data-theme','light'); localStorage.setItem('theme','light'); }
    sync();
  });
})();

if (typeof EGG_SPIRITS!=='undefined') document.getElementById('totalN').textContent=EGG_SPIRITS.length;
syncInputs();
render();
</script>
</body>
</html>
