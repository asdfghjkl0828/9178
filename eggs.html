<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>孵蛋查询 - Roke 伤害计算工具箱</title>
<link rel="stylesheet" href="css/head.css">
<style>
  .egg-intro { font-size:13px; color:var(--text2); line-height:1.7; margin-bottom:14px; background:rgba(124,107,255,.07); border:1px solid rgba(124,107,255,.22); border-radius:10px; padding:10px 14px; }
  .egg-intro b { color:var(--accent); }
  .egg-intro code { background:var(--bg); padding:1px 6px; border-radius:5px; color:var(--text); font-size:12px; }

  .egg-panel { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
  .egg-inputs { display:flex; flex-wrap:wrap; gap:22px; }
  .egg-field { flex:1; min-width:240px; }
  .egg-field > label { font-size:12px; color:var(--text2); font-weight:600; display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .egg-field .val { font-size:18px; font-weight:800; color:var(--accent); }
  .egg-field .val small { font-size:11px; color:var(--text2); font-weight:600; margin-left:3px; }
  .egg-field input[type=range] { width:100%; accent-color:var(--accent); cursor:pointer; }
  .egg-num { display:flex; align-items:center; gap:8px; margin-top:10px; }
  .egg-num input { width:110px; background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:9px 12px; color:var(--text); font-size:15px; font-family:inherit; font-weight:700; }
  .egg-num input:focus { outline:none; border-color:var(--accent); }
  .egg-num .unit { font-size:13px; color:var(--text2); }

  .egg-filters { display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin-top:6px; }
  .seg { display:inline-flex; background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:3px; gap:3px; flex-wrap:wrap; }
  .seg button { border:none; background:transparent; color:var(--text2); font-family:inherit; font-size:13px; font-weight:600; padding:7px 13px; border-radius:7px; cursor:pointer; transition:.15s; }
  .seg button:hover { color:var(--text); }
  .seg button.active { background:var(--accent); color:#fff; }

  .presets { display:flex; flex-wrap:wrap; gap:7px; margin-top:14px; }
  .preset { font-size:12px; color:var(--text2); background:var(--bg); border:1px solid var(--border); border-radius:18px; padding:5px 12px; cursor:pointer; transition:.15s; }
  .preset:hover { color:var(--accent); border-color:var(--accent); }
  .egg-warn { display:none; font-size:12px; color:#ff9a9a; background:rgba(255,80,80,.1); border:1px solid rgba(255,80,80,.3); border-radius:9px; padding:8px 12px; margin-top:12px; line-height:1.6; }
  .egg-warn.show { display:block; }

  .stat-line { font-size:12px; color:var(--text2); margin:4px 2px 12px; }
  .stat-line b { color:var(--text); }

  .result-list { display:flex; flex-direction:column; gap:10px; }
  .result-card { display:flex; align-items:center; gap:13px; background:var(--card); border:1px solid var(--border); border-radius:13px; padding:11px 14px; transition:.12s; cursor:pointer; text-decoration:none; }
  .result-card:hover { border-color:var(--accent); background:var(--card2); }
  .result-card .rank { font-size:16px; font-weight:800; color:var(--text2); width:30px; text-align:center; flex-shrink:0; }
  .result-card .rank.top { color:var(--accent); }
  .result-main { flex:1; min-width:0; }
  .result-name { font-size:15px; font-weight:800; color:var(--text); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .attr-tag { font-size:10px; font-weight:700; color:#fff; padding:1px 7px; border-radius:6px; }
  .result-prob { display:flex; align-items:center; gap:9px; margin-top:5px; }
  .prob-bar-wrap { flex:1; max-width:220px; height:8px; border-radius:5px; background:var(--bg); overflow:hidden; }
  .prob-bar { height:100%; border-radius:5px; background:linear-gradient(90deg,var(--accent),#4FBD72); }
  .prob-val { font-size:13px; font-weight:800; color:var(--text); min-width:46px; }
  .prob-label { font-size:10px; font-weight:700; padding:1px 7px; border-radius:6px; flex-shrink:0; }
  .l-lock { background:rgba(79,189,114,.2); color:#4FBD72; }
  .l-high { background:rgba(124,107,255,.22); color:var(--accent); }
  .l-pos { background:rgba(255,255,255,.08); color:var(--text2); }
  .result-pct { font-size:11px; color:var(--text2); margin-top:4px; }
  .result-pct b { color:var(--text); font-weight:700; }
  .ava-wrap { position:relative; width:46px; height:46px; border-radius:50%; overflow:hidden; flex-shrink:0; background:var(--bg); }
  .ava-wrap img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .ava-wrap .fallback { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--text2); font-size:17px; }
  .empty-row { text-align:center; color:var(--text2); padding:30px; background:var(--card); border:1px dashed var(--border); border-radius:13px; }
  .copy-btn { margin-left:auto; font-size:12px; color:var(--text2); background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:6px 12px; cursor:pointer; flex-shrink:0; }
  .copy-btn:hover { color:var(--accent); border-color:var(--accent); }
  @media (max-width:560px){ .egg-inputs { gap:16px; } .prob-bar-wrap { max-width:none; } }
</style>
</head>
<body>
<header>
  <h1>孵蛋查询</h1>
  <span>输入蛋的尺寸与重量 · 反查最可能孵出的精灵</span>
  <nav class="dex-nav">
    <a href="9178.html">伤害计算器</a>
    <a href="pokedex.html">精灵图鉴</a>
    <a href="skilldex.html">技能图鉴</a>
    <a href="restraint.html">克制计算器</a>
    <a href="speed.html">速度榜单</a>
    <a href="eggs.html" class="active">孵蛋查询</a>
  </nav>
  <div class="header-actions">
    <div class="theme-toggle" id="themeToggle"><span class="tt-icon">🌙</span><span class="tt-text">深色</span></div>
  </div>
</header>

<div class="main">
  <div class="egg-intro">
    把蛋的<b>尺寸</b>（米）和<b>重量</b>（千克）填进去，按每只可孵化精灵的蛋尺寸/重量区间估算<b>契合度</b>，从高到低排出最可能孵出的精灵。
    数据基于 roco-eggs 公开数据集（共 <b id="totalN">0</b> 只可孵化精灵），用区间高斯契合度近似，<b>仅供参考</b>。
  </div>

  <div class="egg-panel">
    <div class="egg-inputs">
      <div class="egg-field">
        <label>蛋尺寸 <span class="val" id="sizeVal">0.30<small>m</small></span></label>
        <input type="range" id="sizeRange" min="0.1" max="3.0" step="0.01" value="0.30">
        <div class="egg-num">
          <input type="number" id="sizeNum" min="0.1" max="3.0" step="0.01" value="0.30">
          <span class="unit">米 (0.1 ~ 3.0)</span>
        </div>
      </div>
      <div class="egg-field">
        <label>蛋重量 <span class="val" id="weightVal">3.17<small>kg</small></span></label>
        <input type="range" id="weightRange" min="0.1" max="720" step="0.01" value="3.17">
        <div class="egg-num">
          <input type="number" id="weightNum" min="0.1" max="720" step="0.01" value="3.17">
          <span class="unit">千克 (0.1 ~ 720)</span>
        </div>
      </div>
    </div>

    <div class="egg-filters">
      <div class="seg" id="eggSeg">
        <button data-egg="any" class="active">不限</button>
        <button data-egg="normal">普通蛋</button>
        <button data-egg="rideable">坐骑蛋</button>
      </div>
      <button class="copy-btn" id="copyBtn">复制结果</button>
    </div>

    <div class="presets" id="presets"></div>
    <div class="egg-warn" id="eggWarn"></div>
  </div>

  <div class="stat-line" id="statLine"></div>
  <div class="result-list" id="resultList"></div>
</div>

<script src="data/type.js"></script>
<script src="data/egg_spirits.js"></script>
<script>
const state = { size:0.30, weight:3.17, egg:'any' };

// 示例预设（取自数据集中各精灵真实蛋区间内的代表值）
const PRESETS = [
  { n:'喵喵', s:0.27, w:1.562 },
  { n:'火花', s:0.27, w:3.14 },
  { n:'蹦蹦种子', s:0.56, w:4.95 },
  { n:'电咩咩', s:0.70, w:8.14 },
  { n:'雪豆丁', s:1.04, w:11.0 }
];

function validList(){
  return EGG_SPIRITS.filter(function(e){
    if (!e.s || !e.w) return false;
    if (state.egg === 'normal' && e.e.indexOf('normal') < 0) return false;
    if (state.egg === 'rideable' && e.e.indexOf('rideable') < 0) return false;
    return true;
  });
}

// 固定容差匹配：用「输入点到该精灵尺寸×重量区间矩形的距离」算契合度，
// 不再按区间宽度缩放带宽（否则超宽区间会对任意输入都高匹配=乱七八糟）。
// 落在区间内=满分，区间外按到最近边的固定容差衰减；区间内再按居中度微调，使同档结果有区分。
const TOL = 0.28; // 综合容差（米与千克的归一并距离）
function scoreOne(e, S, W){
  const smin=e.s[0], smax=e.s[1], wmin=e.w[0], wmax=e.w[1];
  const ds = S<smin ? smin-S : (S>smax ? S-smax : 0);
  const dw = W<wmin ? wmin-W : (W>wmax ? W-wmax : 0);
  const outside = Math.sqrt(ds*ds + dw*dw);
  const fit = Math.exp(-0.5*Math.pow(outside/TOL, 2));
  // 区间内中心偏好（0.75~1），区间外保持 1 不影响衰减
  let center = 1;
  if (smax>smin){ const cs=(S-smin)/(smax-smin); if (cs>=0 && cs<=1) center = Math.min(center, 1-Math.abs(cs-0.5)*0.5); }
  if (wmax>wmin){ const cw=(W-wmin)/(wmax-wmin); if (cw>=0 && cw<=1) center = Math.min(center, 1-Math.abs(cw-0.5)*0.5); }
  const score = fit * (0.82 + 0.18*center);
  let sizePct, weightPct;
  if (S>=smin && S<=smax) sizePct=Math.round((S-smin)/(smax-smin)*100);
  else sizePct = S<smin ? -1 : 101;
  if (W>=wmin && W<=wmax) weightPct=Math.round((W-wmin)/(wmax-wmin)*100);
  else weightPct = W<wmin ? -1 : 101;
  return { score:score, sizePct:sizePct, weightPct:weightPct };
}

function compute(){
  const S=state.size, W=state.weight;
  const list=validList();
  const scored=list.map(function(e){
    const r=scoreOne(e,S,W);
    return { e:e, score:r.score, sizePct:r.sizePct, weightPct:r.weightPct };
  }).filter(function(x){ return x.score >= 0.30; })
    .sort(function(a,b){ return b.score-a.score || a.e.n.localeCompare(b.e.n,'zh'); });
  const top=scored.slice(0,12);
  top.forEach(function(x){ x.prob = x.score; });
  return top;
}

function avatar(en){
  const ch=en.n.charAt(0);
  if (en.img)
    return '<span class="ava-wrap"><span class="fallback">'+ch+'</span><img src="'+en.img+'" alt="'+en.n+'" loading="lazy" onerror="this.style.display=\'none\'"></span>';
  return '<span class="ava-wrap"><span class="fallback">'+ch+'</span></span>';
}

function attrTags(en){
  return (en.a||[]).map(function(a){
    const c=TYPE_COLORS[a] || '#888';
    return '<span class="attr-tag" style="background:'+c+'">'+a+'</span>';
  }).join('');
}

function pctText(v){
  if (v<0) return '↓不足';
  if (v>100) return '↑超出';
  return v+'%';
}

function render(){
  const top=compute();
  const list=document.getElementById('resultList');
  if (!top.length){
    list.innerHTML='<div class="empty-row">当前尺寸 / 重量下没有契合度 ≥30% 的精灵，可能落在数据盲区，或数值超出合理范围。<br>确认单位（米 / 千克）后微调，或切换到「不限」蛋类型再试。</div>';
    document.getElementById('statLine').innerHTML='';
    return;
  }
  const best=top[0].prob;
  document.getElementById('statLine').innerHTML='共 <b>'+validList().length+'</b> 只候选精灵参与匹配 · 命中 <b>'+top.length+'</b> 只（契合度≥30%）· 最可能：<b>'+top[0].e.n+'</b>';

  list.innerHTML=top.map(function(x, i){
    const p=Math.round(x.prob*100);
    const rank=i+1;
    const rkCls = rank<=3 ? 'rank top' : 'rank';
    let label, lcls;
    if (x.prob>=0.85){ label='绝对锁定'; lcls='l-lock'; }
    else if (x.prob>=0.55){ label='高潜目标'; lcls='l-high'; }
    else { label='可能'; lcls='l-pos'; }
    return '<a class="result-card" href="pokedex.html?spirit='+encodeURIComponent(x.e.n)+'">'+
      '<div class="'+rkCls+'">'+rank+'</div>'+
      avatar(x.e)+
      '<div class="result-main">'+
        '<div class="result-name">'+x.e.n+attrTags(x.e)+'</div>'+
        '<div class="result-prob">'+
          '<div class="prob-bar-wrap"><div class="prob-bar" style="width:'+Math.max(4,p)+'%"></div></div>'+
          '<span class="prob-val">'+p+'%</span>'+
          '<span class="prob-label '+lcls+'">'+label+'</span>'+
        '</div>'+
        '<div class="result-pct">尺寸命中 <b>'+pctText(x.sizePct)+'</b> · 重量命中 <b>'+pctText(x.weightPct)+'</b> · 区间 '+x.e.s[0]+'~'+x.e.s[1]+'m / '+x.e.w[0]+'~'+x.e.w[1]+'kg</div>'+
      '</div>'+
    '</a>';
  }).join('');
}

function syncInputs(){
  document.getElementById('sizeRange').value=state.size;
  document.getElementById('sizeNum').value=state.size;
  document.getElementById('weightRange').value=state.weight;
  document.getElementById('weightNum').value=state.weight;
  document.getElementById('sizeVal').innerHTML=state.size.toFixed(2)+'<small>m</small>';
  document.getElementById('weightVal').innerHTML=state.weight.toFixed(2)+'<small>kg</small>';
}

// 超范围警告（输入超出已知蛋范围时提示，并自动按边界计算）
const RANGE = { size:{min:0.1, max:3.0}, weight:{min:0.1, max:720} };
function showWarn(kind, raw){
  const r=RANGE[kind];
  const el=document.getElementById('eggWarn');
  el.textContent='⚠ '+ (kind==='size'?'蛋尺寸':'蛋重量') +'应在 '+r.min+' ~ '+r.max+(kind==='size'?'m':'kg')+' 之间，你输入的 '+raw+' 已超出范围，结果按最近边界计算，可能不准。';
  el.classList.add('show');
}
function hideWarn(){ document.getElementById('eggWarn').classList.remove('show'); }
function clampVal(v, min, max){ return Math.min(max, Math.max(min, v)); }

// 控件绑定
document.getElementById('sizeRange').addEventListener('input', function(){ state.size=parseFloat(this.value); syncInputs(); render(); });
document.getElementById('sizeNum').addEventListener('input', function(){
  let v=parseFloat(this.value); if(isNaN(v)) return;
  if (v<RANGE.size.min || v>RANGE.size.max) showWarn('size', this.value); else hideWarn();
  state.size=clampVal(v, RANGE.size.min, RANGE.size.max); syncInputs(); render();
});
document.getElementById('weightRange').addEventListener('input', function(){ state.weight=parseFloat(this.value); syncInputs(); render(); });
document.getElementById('weightNum').addEventListener('input', function(){
  let v=parseFloat(this.value); if(isNaN(v)) return;
  if (v<RANGE.weight.min || v>RANGE.weight.max) showWarn('weight', this.value); else hideWarn();
  state.weight=clampVal(v, RANGE.weight.min, RANGE.weight.max); syncInputs(); render();
});
document.getElementById('eggSeg').addEventListener('click', function(e){
  const btn=e.target.closest('button'); if(!btn) return;
  state.egg=btn.dataset.egg;
  Array.prototype.forEach.call(this.children, function(b){ b.classList.toggle('active', b===btn); });
  render();
});

// 预设示例
const presetsEl=document.getElementById('presets');
presetsEl.innerHTML=PRESETS.map(function(p){
  return '<span class="preset" data-s="'+p.s+'" data-w="'+p.w+'">'+p.n+'（'+p.s+'m/'+p.w+'kg）</span>';
}).join('');
presetsEl.addEventListener('click', function(e){
  const el=e.target.closest('.preset'); if(!el) return;
  state.size=parseFloat(el.dataset.s); state.weight=parseFloat(el.dataset.w);
  syncInputs(); render();
});

// 复制结果
document.getElementById('copyBtn').addEventListener('click', function(){
  const top=compute(); if(!top.length){ alert('暂无匹配结果'); return; }
  let txt='【孵蛋查询结果】尺寸 '+state.size.toFixed(2)+'m / 重量 '+state.weight.toFixed(2)+'kg\n';
  top.forEach(function(x,i){ txt+=(i+1)+'. '+x.e.n+' '+(Math.round(x.prob*100))+'%\n'; });
  navigator.clipboard.writeText(txt).then(function(){ alert('已复制结果'); }, function(){ alert('复制失败，请手动选择'); });
});

// 主题切换
(function(){
  const t=document.getElementById('themeToggle');
  const saved=localStorage.getItem('theme');
  if (saved==='light') document.documentElement.setAttribute('data-theme','light');
  function sync(){
    const isLight=document.documentElement.getAttribute('data-theme')==='light';
    t.querySelector('.tt-icon').textContent=isLight?'☀️':'🌙';
    t.querySelector('.tt-text').textContent=isLight?'浅色':'深色';
  }
  sync();
  t.addEventListener('click', function(){
    const isLight=document.documentElement.getAttribute('data-theme')==='light';
    if(isLight){ document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme','dark'); }
    else { document.documentElement.setAttribute('data-theme','light'); localStorage.setItem('theme','light'); }
    sync();
  });
})();

if (typeof EGG_SPIRITS!=='undefined') document.getElementById('totalN').textContent=EGG_SPIRITS.length;
syncInputs();
render();
</script>
</body>
</html>
