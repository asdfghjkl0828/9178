<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>炫彩精灵 - 洛克王国 PVP 计算器</title>
<link rel="stylesheet" href="css/head.css">
<style>
  .dex-nav { display:flex; gap:6px; margin-left:16px; align-items:center; flex-wrap:wrap; }
  .dex-nav a { color:rgba(255,255,255,.82); text-decoration:none; font-size:13px; padding:5px 11px; border-radius:18px; border:1px solid rgba(255,255,255,.18); white-space:nowrap; }
  .dex-nav a:hover { background:rgba(255,255,255,.15); }
  .dex-nav a.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .sub { color:var(--text2); font-size:13px; margin-bottom:14px; line-height:1.7; }
  .sub b { color:var(--text); }
  .note { background:rgba(255,170,80,.1); border:1px solid rgba(255,170,80,.35); border-radius:10px; padding:11px 14px; font-size:12.5px; color:rgba(255,210,150,.95); margin:10px 0; line-height:1.7; }
  .rt-box { display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin:14px 0; }
  .rt-box input { flex:1; min-width:120px; background:var(--card2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 11px; font-size:14px; }
  .rt-box button { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:7px 14px; font-size:14px; cursor:pointer; }
  .rt-box button:hover { filter:brightness(1.1); }
  .rt-box button.ghost { background:transparent; border:1px solid var(--border); color:var(--text2); }
  .rt-box .hint { font-size:12px; color:var(--text2); }
  .count { font-size:13px; color:var(--text2); margin:8px 0 14px; }
  .xgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; }
  .xcard { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; text-align:center; display:flex; flex-direction:column; align-items:center; }
  .xcard .imgwrap { width:120px; height:120px; margin:0 auto 8px; background:#f5f6fa; border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .xcard img.origin { max-width:100%; max-height:100%; object-fit:contain; }
  .xcard .name { font-size:16px; font-weight:700; color:var(--text); margin-top:2px; }
  .xcard .default { font-size:12px; color:var(--text2); margin-top:2px; }
  .xcard .xc-badge { display:inline-block; margin-top:8px; background:linear-gradient(135deg,#ff6ec4,#7873f5); color:#fff; font-size:12px; font-weight:700; padding:3px 10px; border-radius:10px; }
  .xcard .meta { font-size:12px; color:var(--text2); margin-top:8px; line-height:1.6; }
  .xcard .gid { font-family:monospace; font-size:11px; color:var(--text2); margin-top:6px; opacity:.7; }
  .shot-area { margin-top:10px; width:100%; }
  .shot-area img.shot { width:100%; border-radius:8px; border:1px solid var(--border); display:block; }
  .shot-area .shot-tag { font-size:11px; color:#7fe0a0; margin-top:4px; }
  .upload-btn { margin-top:8px; font-size:11px; background:var(--card2); border:1px dashed var(--border); color:var(--text2); border-radius:8px; padding:6px 10px; cursor:pointer; width:100%; }
  .upload-btn:hover { border-color:var(--accent); color:var(--text); }
  .del-shot { font-size:10px; color:#ff8a8a; background:none; border:none; cursor:pointer; margin-top:5px; text-decoration:underline; }
  .empty { padding:40px; text-align:center; color:var(--text2); font-size:14px; grid-column:1/-1; }
</style>
</head>
<body>
<header>
  <div style="font-size:24px">🛠️</div>
  <div style="display:flex;flex-direction:column;gap:2px">
    <h1>洛克王国 PVP 工具箱</h1>
  </div>
  <nav class="dex-nav">
    <a href="index.html" class="home-link">工具箱</a>
    <a href="calc.html">伤害计算器</a>
    <a href="pokedex.html">精灵图鉴</a>
    <a href="skilldex.html">技能图鉴</a>
    <a href="restraint.html">克制计算器</a>
    <a href="speed.html">速度榜单</a>
    <a href="eggs.html">孵蛋查询</a>
    <a href="merchant.html">远行商人</a>
    <a href="color.html" class="active">炫彩精灵</a>
    <a href="home.html">家园查询</a>
  </nav>
  <div class="header-actions">
    <div class="theme-toggle" id="themeToggle"><span class="tt-icon">🌙</span><span class="tt-text">深色</span></div>
  </div>
</header>

<div class="main">
  <h2>🌈 炫彩 / 异色精灵</h2>
  <p class="sub">
    输入游戏 UID，列出该账号下所有带<b>特殊配色</b>的精灵（异色 / 异色炫彩）。<br>
    <b>重要限制：</b>炫彩的随机配色是游戏客户端实时渲染的，<b>服务器不存、公开图库（BWiki / rocodex）也无独立资源</b>，所以网页无法自动显示某只精灵真实的炫彩颜色。本页给出两条路：① 下方「原型立绘」是该精灵的普通形态（仅作对照，<b>不是</b>炫彩色）；② 你可以<b>上传游戏内的炫彩实机截图</b>，本页会把它存在本机浏览器并展示——这才是看到真实炫彩颜色的唯一办法。
  </p>

  <div class="rt-box">
    <input id="uid" type="text" inputmode="numeric" placeholder="UID" value="5678116">
    <button id="queryBtn">查询最新</button>
    <button id="clearBtn" class="ghost" title="清除本机保存的所有截图">清空本机截图</button>
    <span class="hint" id="hint"></span>
  </div>

  <div class="note" id="note" style="display:none"></div>
  <div class="count" id="count"></div>
  <div class="xgrid" id="xgrid"></div>
</div>

<script>
const RT_PROXY_DEFAULT = 'https://db643367.roco-proxy.pages.dev';
const ICON_BASE = 'https://rocodex.org';
const FALLBACK_INDEX = 'data/home_index.json';

function proxyBase(){ return localStorage.getItem('rt_proxy') || RT_PROXY_DEFAULT; }
function setHint(t){ document.getElementById('hint').textContent = t || ''; }
function setNote(t){ const n=document.getElementById('note'); n.textContent=t; n.style.display = t ? 'block' : 'none'; }

function shotKey(uid, gid){ return 'xcshot_' + uid + '_' + gid; }
function loadShot(uid, gid){ try { return localStorage.getItem(shotKey(uid, gid)); } catch(e){ return null; } }
function saveShot(uid, gid, data){ try { localStorage.setItem(shotKey(uid, gid), data); } catch(e){ alert('保存失败：本机存储可能已满（截图太大）'); } }
function delShot(uid, gid){ try { localStorage.removeItem(shotKey(uid, gid)); } catch(e){} }

async function fetchRealtime(uid){
  const res = await fetch(proxyBase() + '/home?uid=' + uid);
  if (!res.ok) throw new Error('代理返回 HTTP ' + res.status);
  const j = await res.json();
  if (j.error || !j.data) throw new Error('数据异常: ' + (j.message || 'no data'));
  return j.data;
}
async function fetchSnapshot(uid){
  const idx = await (await fetch(FALLBACK_INDEX + '?t=' + Date.now())).json();
  const hit = (idx.uids || []).find(u => String(u.uid) === String(uid) && u.ok);
  if (!hit) throw new Error('该 UID 无每小时快照数据');
  const fr = await fetch('data/home_' + uid + '.json?t=' + Date.now());
  if (!fr.ok) throw new Error('快照读取失败 HTTP ' + fr.status);
  return (await fr.json()).data;
}

function isColorful(p){
  const m = String(p.mutationName || '');
  return m.includes('异色') || m.includes('炫彩');
}

const CUR_UID = { v: '' };

function renderPets(pets, source){
  const list = pets.filter(isColorful);
  const uid = CUR_UID.v;
  const grid = document.getElementById('xgrid');
  document.getElementById('count').textContent = '共 ' + pets.length + ' 只精灵，其中异色/炫彩 ' + list.length + ' 只（数据源：' + source + '）';
  if (list.length === 0){
    grid.innerHTML = '<div class="empty">该账号下暂无异色 / 炫彩精灵。</div>';
    return;
  }
  grid.innerHTML = list.map(function(p){
    const gid = p.gid || p.petId || '';
    const spName = p.defaultName || p.name || '';
    const icon = p.icon ? ICON_BASE + p.icon : '';
    const originImg = icon ? '<img class="origin" src="' + icon + '" alt="' + spName + '" loading="lazy" onerror="this.style.display=\'none\'">' : '<span style="color:#999;font-size:12px">无立绘</span>';
    const def = (p.defaultName && p.defaultName !== p.name) ? '<div class="default">原型：' + p.defaultName + '</div>' : '';
    const shot = loadShot(uid, gid);
    const shotHtml = shot
      ? '<img class="shot" src="' + shot + '" alt="炫彩截图"><div class="shot-tag">✓ 已存本机截图</div><button class="del-shot" onclick="delOne(\'' + uid + '\',\'' + gid + '\')">删除这张</button>'
      : '<button class="upload-btn" onclick="document.getElementById(\'file_' + gid + '\').click()">📷 上传炫彩实机截图</button>';
    return '<div class="xcard">'
      + '<div class="imgwrap">' + originImg + '</div>'
      + '<div class="name">' + (p.name || '?') + '</div>'
      + def
      + '<div class="xc-badge">' + (p.mutationName || '异色') + '</div>'
      + '<div class="meta">Lv.' + (p.lv || '?') + (p.sex != null ? ' · ' + (p.sex === 1 ? '雄' : (p.sex === 2 ? '雌' : '无')) : '') + '</div>'
      + '<div class="gid">gid: ' + gid + '</div>'
      + '<div class="shot-area">' + shotHtml
      + '<input id="file_' + gid + '" type="file" accept="image/*" style="display:none" onchange="onShot(this,\'' + uid + '\',\'' + gid + '\')">'
      + '</div>'
      + '</div>';
  }).join('');
}

function onShot(input, uid, gid){
  const f = input.files && input.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = function(e){
    saveShot(uid, gid, e.target.result);
    query();
  };
  reader.readAsDataURL(f);
}
function delOne(uid, gid){ delShot(uid, gid); query(); }

async function query(){
  const uid = (document.getElementById('uid').value || '').trim();
  if (!uid){ setHint('请输入 UID'); return; }
  CUR_UID.v = uid;
  setHint('查询中…'); setNote('');
  document.getElementById('xgrid').innerHTML = '';
  document.getElementById('count').textContent = '';
  try {
    const data = await fetchRealtime(uid);
    renderPets(data.pets || [], '云端代理（实时）');
    setHint('✓ 实时');
  } catch(e1){
    setHint('实时失败，回退快照…');
    try {
      const data = await fetchSnapshot(uid);
      renderPets(data.pets || [], '每小时快照');
      setNote('实时查询失败（' + e1.message + '），已回退每小时快照（数据可能滞后数小时）。');
    } catch(e2){
      setHint('失败');
      setNote('实时 + 快照都失败：' + e1.message + ' / ' + e2.message);
      document.getElementById('xgrid').innerHTML = '<div class="empty">无法获取该 UID 的精灵数据。</div>';
    }
  }
}

document.getElementById('queryBtn').addEventListener('click', query);
document.getElementById('uid').addEventListener('keydown', function(e){ if (e.key === 'Enter') query(); });
document.getElementById('clearBtn').addEventListener('click', function(){
  const uid = CUR_UID.v || (document.getElementById('uid').value || '').trim();
  if (!uid){ alert('请先输入 UID'); return; }
  if (!confirm('确认清除本机保存的「' + uid + '」全部炫彩截图？')) return;
  const keys = [];
  for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && k.indexOf('xcshot_' + uid + '_') === 0) keys.push(k); }
  keys.forEach(k => localStorage.removeItem(k));
  alert('已清除 ' + keys.length + ' 张截图（仅本机）');
  query();
});

function toggleTheme(){
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if (isLight){ document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme','dark'); document.getElementById('themeToggle').innerHTML = '<span class="tt-icon">🌙</span><span class="tt-text">深色</span>'; }
  else { document.documentElement.setAttribute('data-theme','light'); localStorage.setItem('theme','light'); document.getElementById('themeToggle').innerHTML = '<span class="tt-icon">☀️</span><span class="tt-text">日间</span>'; }
}
document.getElementById('themeToggle').addEventListener('click', toggleTheme);
(function(){ if (localStorage.getItem('theme') === 'light'){ document.documentElement.setAttribute('data-theme','light'); document.getElementById('themeToggle').innerHTML = '<span class="tt-icon">☀️</span><span class="tt-text">日间</span>'; } })();

query();
</script>
</body>
</html>
